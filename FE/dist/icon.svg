<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- dark squircle background (Chrome masks the icon to a rounded shape) -->
  <rect width="512" height="512" rx="96" fill="#0c0d10"/>

  <!-- chat bubble: rounded rect with a tail at bottom-left -->
  <path d="M 80 144
           h 224
           a 40 40 0 0 1 40 40
           v 120
           a 40 40 0 0 1 -40 40
           h -104
           l -40 40
           v -40
           h -80
           a 40 40 0 0 1 -40 -40
           v -120
           a 40 40 0 0 1 40 -40 z"
        fill="#f16913"/>

  <!-- sound waves emanating to the right of the bubble -->
  <path d="M 372 200 Q 412 232 372 264"
        stroke="#f3f4f6" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M 372 156 Q 452 232 372 308"
        stroke="#f3f4f6" stroke-width="22" fill="none" stroke-linecap="round"/>
</svg>
