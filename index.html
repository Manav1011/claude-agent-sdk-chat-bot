<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA Automation Studio</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Markdown & Code Highlighting Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#f16913',
              hover: '#ff7b25',
              glow: 'rgba(241, 105, 19, 0.15)',
              border: 'rgba(241, 105, 19, 0.3)',
            },
            dark: {
              bg: '#0c0d10',
              surface: '#14151a',
              elevated: '#1c1e26',
              border: '#2a2d37',
              muted: '#343846',
            },
            txt: {
              main: '#f3f4f6',
              muted: '#9ca3af',
              subtle: '#6b7280',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          boxShadow: {
            'glow': '0 0 20px rgba(241, 105, 19, 0.15)',
            'card-glow': '0 4px 20px -2px rgba(0, 0, 0, 0.5)',
          }
        },
      },
    }
  </script>

  <style>
    /* Global Reset & Glassmorphism */
    body {
      background-color: #0c0d10;
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    /* Ambient background glow */
    .bg-ambient {
      background: radial-gradient(circle at 50% 0%, rgba(241, 105, 19, 0.08) 0%, transparent 60%),
                  radial-gradient(circle at 100% 100%, rgba(20, 21, 26, 0.8) 0%, transparent 50%);
    }

    /* Custom Matching Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(241, 105, 19, 0.5);
    }
    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
    }

    /* Markdown styling inside assistant messages */
    .prose-dark {
      color: #e5e7eb;
      font-size: 0.925rem;
      line-height: 1.6;
      word-break: break-word;
      overflow-wrap: break-word;
      max-width: 100%;
    }
    .prose-dark p {
      margin-bottom: 0.75rem;
    }
    .prose-dark p:last-child {
      margin-bottom: 0;
    }
    .prose-dark h1, .prose-dark h2, .prose-dark h3, .prose-dark h4 {
      color: #ffffff;
      font-weight: 600;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
      word-break: break-word;
    }
    .prose-dark ul {
      list-style-type: disc;
      padding-left: 1.25rem;
      margin-bottom: 0.75rem;
    }
    .prose-dark ol {
      list-style-type: decimal;
      padding-left: 1.25rem;
      margin-bottom: 0.75rem;
    }
    .prose-dark li {
      margin-bottom: 0.25rem;
      word-break: break-word;
    }
    .prose-dark code:not(pre code) {
      background: #2a2d37;
      color: #f16913;
      padding: 0.15rem 0.4rem;
      border-radius: 0.25rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.825em;
      word-break: break-all;
    }
    .prose-dark pre {
      background: #14151a !important;
      border: 1px solid #2a2d37;
      border-radius: 0.5rem;
      margin: 0.75rem 0;
      position: relative;
      overflow-x: auto;
      max-width: 100%;
    }
    .prose-dark pre code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.825rem;
      padding: 1rem !important;
      display: block;
      overflow-x: auto;
      white-space: pre;
    }
    .prose-dark table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.75rem 0;
      font-size: 0.85rem;
      display: block;
      overflow-x: auto;
      max-width: 100%;
    }
    .prose-dark th {
      background-color: #1c1e26;
      color: #ffffff;
      font-weight: 600;
      text-align: left;
      padding: 0.6rem 0.8rem;
      border: 1px solid #2a2d37;
    }
    .prose-dark td {
      padding: 0.5rem 0.8rem;
      border: 1px solid #2a2d37;
    }
    .prose-dark tr:nth-child(even) {
      background-color: rgba(28, 30, 38, 0.4);
    }

    /* Message animation */
    @keyframes slideUpFade {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-msg {
      animation: slideUpFade 0.25s ease-out forwards;
    }

    /* Typing Dots Animation */
    @keyframes dotPulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.1); }
    }
    .pulse-dot {
      animation: dotPulse 1.4s infinite ease-in-out both;
    }
    .pulse-dot:nth-child(1) { animation-delay: -0.32s; }
    .pulse-dot:nth-child(2) { animation-delay: -0.16s; }
  </style>
</head>
<body class="bg-dark-bg text-txt-main h-screen flex flex-col antialiased selection:bg-brand selection:text-white">
  
  <div class="flex h-full w-full bg-ambient relative overflow-hidden">
    
    <!-- Mobile Sidebar Backdrop -->
    <div id="sidebar-backdrop" class="fixed inset-0 bg-black/60 z-30 hidden lg:hidden backdrop-blur-sm transition-opacity"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-72 bg-dark-surface/95 backdrop-blur-md border-r border-dark-border flex flex-col shrink-0 transition-transform duration-300 -translate-x-full lg:translate-x-0 lg:static">
      
      <!-- App Brand Row -->
      <div class="p-3 border-b border-dark-border flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-brand to-amber-600 flex items-center justify-center shadow-glow text-dark-bg font-bold">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
          </div>
          <div>
            <span class="font-semibold text-xs text-white">Explainer Bot</span>
            <span class="text-[9px] text-txt-subtle block font-mono">Workspace Studio</span>
          </div>
        </div>
      </div>

      <!-- Projects Section Header with Expand/Collapse & Add Project -->
      <div class="px-3 pt-3 pb-1.5 flex items-center justify-between text-[11px] font-semibold text-txt-subtle uppercase tracking-wider">
        <div class="flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5 text-txt-subtle" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
          </svg>
          <span>Projects</span>
        </div>
        <div class="flex items-center gap-1">
          <button id="expand-all-btn" title="Expand all projects" class="p-1 rounded hover:bg-dark-elevated hover:text-white text-txt-subtle transition-colors flex items-center justify-center" aria-label="Expand all">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
          <button id="collapse-all-btn" title="Collapse all projects" class="p-1 rounded hover:bg-dark-elevated hover:text-white text-txt-subtle transition-colors flex items-center justify-center" aria-label="Collapse all">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/>
            </svg>
          </button>
          <button id="add-project-btn" title="Add project by path" class="px-2 py-0.5 rounded-md bg-dark-elevated hover:bg-dark-border text-txt-subtle hover:text-white transition-colors flex items-center gap-1 text-[10px] normal-case font-medium border border-dark-border ml-0.5">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            <span>Add</span>
          </button>
        </div>
      </div>

      <!-- Add Project Inline Form (Hidden by default) -->
      <div id="add-project-form" class="mx-3 my-2 p-2.5 bg-dark-elevated/90 border border-brand/40 rounded-xl space-y-2 text-xs hidden animate-msg">
        <div class="font-medium text-[11px] text-white flex items-center justify-between">
          <span>Add Project</span>
          <button id="cancel-add-project-btn" class="text-txt-subtle hover:text-white text-sm leading-none">&times;</button>
        </div>
        <input id="new-project-path-input" type="text" placeholder="/path/to/project" class="w-full bg-dark-bg border border-dark-border rounded-lg px-2.5 py-1.5 text-[11px] text-white font-mono placeholder:text-txt-subtle focus:outline-none focus:border-brand-border" />
        <input id="new-project-name-input" type="text" placeholder="Project name (optional)" class="w-full bg-dark-bg border border-dark-border rounded-lg px-2.5 py-1.5 text-[11px] text-white placeholder:text-txt-subtle focus:outline-none focus:border-brand-border" />
        <button id="submit-add-project-btn" class="w-full bg-brand hover:bg-brand-hover text-white text-[11px] font-medium py-1.5 rounded-lg transition-colors shadow-glow">Track Project</button>
      </div>

      <!-- Projects & Sessions Tree Container -->
      <div id="projects-container" class="flex-1 overflow-y-auto px-2 py-1 space-y-1.5"></div>

    </aside>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col min-w-0 h-full relative overflow-hidden">
      
      <!-- Unified Header Bar -->
      <header class="h-12 px-3 sm:px-5 border-b border-dark-border/60 bg-dark-surface/40 backdrop-blur-md flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2.5">
          <button id="menu-toggle" class="lg:hidden p-1.5 text-txt-muted hover:text-white rounded-lg bg-dark-elevated border border-dark-border" title="Toggle menu">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
          <span class="font-medium text-xs sm:text-sm text-white tracking-wide">QA Automation</span>
        </div>

        <div class="flex items-center gap-2">
          <div class="flex bg-dark-elevated rounded-lg p-0.5 border border-dark-border text-xs">
            <button id="mode-normal" class="px-2.5 py-0.5 sm:px-3 sm:py-1 rounded-md text-[11px] sm:text-xs transition-colors bg-brand text-white font-medium shadow-sm">Normal</button>
            <button id="mode-blocks" class="px-2.5 py-0.5 sm:px-3 sm:py-1 rounded-md text-[11px] sm:text-xs transition-colors text-txt-subtle hover:text-white">Blocks</button>
          </div>
          <button id="settings-btn" title="Settings" class="p-1.5 rounded-lg bg-dark-elevated hover:bg-dark-border border border-dark-border text-txt-muted hover:text-white transition-colors flex items-center justify-center">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Chat Messages Scroll Container -->
      <div id="messages-container" class="flex-1 overflow-y-auto overflow-x-hidden p-3 sm:p-5 space-y-4 w-full min-w-0">
        
        <!-- Empty State -->
        <div id="empty-state" class="h-full flex flex-col items-center justify-center text-center my-auto py-10 w-full max-w-3xl lg:max-w-4xl mx-auto">
          <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand/20 to-amber-500/10 border border-brand-border flex items-center justify-center mb-4 shadow-glow">
            <svg class="w-6 h-6 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
          </div>
          <h2 class="text-base sm:text-lg font-semibold text-white mb-1.5">What would you like to explore?</h2>
          <p class="text-txt-muted text-xs sm:text-sm max-w-md mb-6 leading-relaxed">
            Ask questions, run automation workflows, or explore interactive structured explanation blocks.
          </p>

          <!-- Prompt Cards -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 w-full max-w-md">
            <button class="prompt-chip text-left p-3 rounded-xl bg-dark-surface hover:bg-dark-elevated border border-dark-border hover:border-brand-border transition-all duration-200 group">
              <div class="font-medium text-xs text-white group-hover:text-brand mb-0.5">What skills do you have?</div>
              <div class="text-[11px] text-txt-subtle truncate">List all installed capabilities</div>
            </button>
            <button class="prompt-chip text-left p-3 rounded-xl bg-dark-surface hover:bg-dark-elevated border border-dark-border hover:border-brand-border transition-all duration-200 group">
              <div class="font-medium text-xs text-white group-hover:text-brand mb-0.5">Explain Machine Learning</div>
              <div class="text-[11px] text-txt-subtle truncate">Structured breakdown with audio walkthrough</div>
            </button>
          </div>
        </div>

      </div>

      <!-- Floating Input Container -->
      <div class="px-3 pb-3 pt-1 sm:px-4 sm:pb-4 w-full max-w-2xl lg:max-w-3xl mx-auto shrink-0 min-w-0">
        <div class="relative rounded-xl bg-dark-surface/95 backdrop-blur-xl border border-dark-border focus-within:border-brand/60 shadow-lg transition-all duration-150 px-3 py-2">
          
          <textarea
            id="message-input"
            rows="1"
            placeholder="Type a message or prompt..."
            class="w-full bg-transparent px-0.5 py-0.5 text-xs sm:text-sm text-txt-main placeholder-txt-subtle focus:outline-none resize-none max-h-32 font-sans leading-relaxed block overflow-y-auto min-h-[22px]"
          ></textarea>

          <div class="flex items-center justify-between pt-1.5 mt-0.5 text-[11px] text-txt-subtle">
            <span class="text-[10px] text-txt-subtle font-mono">Shift + Enter for new line</span>

            <div class="flex items-center gap-2">
              <!-- Context usage progress bar -->
              <div id="context-usage-bar" class="hidden items-center gap-1.5 cursor-pointer font-mono text-[11px] select-none text-brand hover:brightness-110 transition-all" onclick="showContextModal()" title="View context breakdown">
                <span class="text-brand font-bold">[</span>
                <span id="context-usage-blocks" class="tracking-tight inline-flex leading-none"></span>
                <span class="text-brand font-bold">]</span>
                <span id="context-usage-label" class="text-[10px] font-mono text-brand font-medium">0%</span>
              </div>

              <button
                id="send-btn"
                disabled
                title="Send message"
                class="bg-brand hover:bg-brand-hover text-white p-1.5 rounded-lg flex items-center justify-center transition-all duration-150 disabled:opacity-25 disabled:hover:bg-brand shadow-sm active:scale-95 shrink-0"
              >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                </svg>
              </button>
            </div>
          </div>

        </div>
      </div>

    </main>

  </div>

  <!-- JavaScript Logic -->
  <script>
    // ============== Setup Markdown Renderer ==============
    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true
    });

    // Helper to get initial setting_sources
    function getInitialSettingSources() {
      const stored = localStorage.getItem('qa-setting-sources');
      if (stored === 'user') return ['user'];
      if (stored === 'local') return ['local'];
      if (stored && stored.startsWith('[')) {
        try { return JSON.parse(stored); } catch(e) { return null; }
      }
      return null;
    }

    // ============== State Management ==============
    const state = {
      currentThreadId: localStorage.getItem('qa-chat-current-thread') || null,
      activeProjectId: localStorage.getItem('qa-active-project-id') ? parseInt(localStorage.getItem('qa-active-project-id'), 10) : null,
      projects: [],
      projectSessions: {},
      expandedProjects: new Set(),
      loadingProjects: new Set(),
      messages: {},
      blocks: {},
      currentMode: 'normal',
      enableBlocks: localStorage.getItem('qa-enable-blocks') === 'true',
      settingSources: getInitialSettingSources(),
      skillsMode: localStorage.getItem('qa-skills-mode') || 'default',
      skillsList: JSON.parse(localStorage.getItem('qa-skills-list') || '[]'),
      permissionMode: localStorage.getItem('qa-permission-mode') || null,
      contextUsage: null,
      isStreaming: false,
      abortController: null,
    };

    function setCurrentThread(threadId) {
      state.currentThreadId = threadId;
      if (threadId) {
        localStorage.setItem('qa-chat-current-thread', threadId);
      } else {
        localStorage.removeItem('qa-chat-current-thread');
      }
    }

    function getSessionMessages(threadId) {
      return state.messages[threadId] || [];
    }

    // ============== Elements Reference ==============
    const el = {
      sidebar: document.getElementById('sidebar'),
      sidebarBackdrop: document.getElementById('sidebar-backdrop'),
      projectsContainer: document.getElementById('projects-container'),
      expandAllBtn: document.getElementById('expand-all-btn'),
      collapseAllBtn: document.getElementById('collapse-all-btn'),
      addProjectBtn: document.getElementById('add-project-btn'),
      addProjectForm: document.getElementById('add-project-form'),
      newProjectPathInput: document.getElementById('new-project-path-input'),
      newProjectNameInput: document.getElementById('new-project-name-input'),
      submitAddProjectBtn: document.getElementById('submit-add-project-btn'),
      cancelAddProjectBtn: document.getElementById('cancel-add-project-btn'),
      messagesContainer: document.getElementById('messages-container'),
      emptyState: document.getElementById('empty-state'),
      messageInput: document.getElementById('message-input'),
      sendBtn: document.getElementById('send-btn'),
      menuToggle: document.getElementById('menu-toggle'),
      settingsBtn: document.getElementById('settings-btn'),
      contextUsageBar: document.getElementById('context-usage-bar'),
      contextUsageBlocks: document.getElementById('context-usage-blocks'),
      contextUsageLabel: document.getElementById('context-usage-label'),
      modeNormalBtn: document.getElementById('mode-normal'),
      modeBlocksBtn: document.getElementById('mode-blocks'),
    };

    function setMode(mode) {
      if (state.currentMode === mode) return;
      stopBlocksAudio();
      if (state.isStreaming && state.abortController) {
        state.abortController.abort();
        state.abortController = null;
        state.isStreaming = false;
      }
      state.currentMode = mode;
      if (mode === 'blocks') {
        if (el.modeNormalBtn) el.modeNormalBtn.className = 'px-2.5 py-0.5 sm:px-3 sm:py-1 rounded-md text-[11px] sm:text-xs transition-colors text-txt-subtle hover:text-white';
        if (el.modeBlocksBtn) el.modeBlocksBtn.className = 'px-2.5 py-0.5 sm:px-3 sm:py-1 rounded-md text-[11px] sm:text-xs transition-colors bg-brand text-white font-medium shadow-sm';
      } else {
        if (el.modeNormalBtn) el.modeNormalBtn.className = 'px-2.5 py-0.5 sm:px-3 sm:py-1 rounded-md text-[11px] sm:text-xs transition-colors bg-brand text-white font-medium shadow-sm';
        if (el.modeBlocksBtn) el.modeBlocksBtn.className = 'px-2.5 py-0.5 sm:px-3 sm:py-1 rounded-md text-[11px] sm:text-xs transition-colors text-txt-subtle hover:text-white';
      }
      if (state.currentThreadId && !state.isStreaming) {
        renderCurrentSessionView(state.currentThreadId);
      }
    }

    // ============== Projects & Sessions API ==============
    async function loadProjects() {
      try {
        const res = await fetch('/api/projects');
        if (!res.ok) return;
        const data = await res.json();
        state.projects = data.projects || [];

        // If no projects tracked yet, auto-add default workspace as initial project
        if (state.projects.length === 0) {
          try {
            const wsRes = await fetch('/api/workspace');
            if (wsRes.ok) {
              const wsData = await wsRes.json();
              const defaultPath = wsData.workspace || '.';
              const name = defaultPath.split('/').filter(Boolean).pop() || 'Default Project';
              const createRes = await fetch('/api/projects', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, path: defaultPath })
              });
              if (createRes.ok) {
                const newProj = await createRes.json();
                state.projects = [newProj];
              }
            }
          } catch (err) {
            console.error('Failed to auto-add default project:', err);
          }
        }

        // Auto-expand active or first project
        if (state.projects.length > 0) {
          const activeProj = state.projects.find(p => p.id === state.activeProjectId) || state.projects[0];
          if (activeProj) {
            state.activeProjectId = activeProj.id;
            localStorage.setItem('qa-active-project-id', activeProj.id);
            state.expandedProjects.add(activeProj.id);
            await loadProjectSessions(activeProj.id);
          }
        }

        renderProjects();
      } catch (e) {
        console.error('Failed to load projects:', e);
      }
    }

    async function loadProjectSessions(projectId) {
      try {
        const res = await fetch(`/api/projects/${projectId}/sessions`);
        if (res.ok) {
          const data = await res.json();
          state.projectSessions[projectId] = data.sessions || [];
        } else {
          state.projectSessions[projectId] = [];
        }
      } catch (e) {
        console.error('Failed to load project sessions:', e);
        state.projectSessions[projectId] = [];
      }
    }

    async function addNewProject(name, path) {
      if (!path || !path.trim()) {
        showNotification('Please provide a valid project directory path', 'error');
        return false;
      }
      const cleanPath = path.trim();
      const projName = (name && name.trim()) ? name.trim() : (cleanPath.split('/').filter(Boolean).pop() || 'Project');

      try {
        const res = await fetch('/api/projects', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: projName, path: cleanPath })
        });

        const data = await res.json();
        if (!res.ok) {
          showNotification(data.detail || 'Failed to add project', 'error');
          return false;
        }

        state.projects.unshift(data);
        state.activeProjectId = data.id;
        localStorage.setItem('qa-active-project-id', data.id);
        state.expandedProjects.add(data.id);
        await loadProjectSessions(data.id);
        renderProjects();
        startNewChat();
        showNotification(`Project "${projName}" added`, 'success');
        return true;
      } catch (e) {
        showNotification(e.message || 'Failed to add project', 'error');
        return false;
      }
    }

    async function deleteProject(projectId) {
      try {
        const res = await fetch(`/api/projects/${projectId}`, { method: 'DELETE' });
        if (res.ok) {
          state.projects = state.projects.filter(p => p.id !== projectId);
          state.expandedProjects.delete(projectId);
          delete state.projectSessions[projectId];
          if (state.activeProjectId === projectId) {
            if (state.projects.length > 0) {
              state.activeProjectId = state.projects[0].id;
              localStorage.setItem('qa-active-project-id', state.projects[0].id);
              state.expandedProjects.add(state.projects[0].id);
              await loadProjectSessions(state.projects[0].id);
            } else {
              state.activeProjectId = null;
              localStorage.removeItem('qa-active-project-id');
            }
          }
          renderProjects();
          showNotification('Project removed from tracking', 'info');
        }
      } catch (e) {
        showNotification('Failed to remove project', 'error');
      }
    }

    async function toggleProject(projectId) {
      const proj = state.projects.find(p => p.id === projectId);
      if (proj) {
        state.activeProjectId = proj.id;
        localStorage.setItem('qa-active-project-id', proj.id);
      }

      if (state.expandedProjects.has(projectId)) {
        state.expandedProjects.delete(projectId);
        renderProjects();
      } else {
        state.expandedProjects.add(projectId);
        if (!state.projectSessions[projectId]) {
          state.loadingProjects.add(projectId);
          renderProjects();
          await loadProjectSessions(projectId);
          state.loadingProjects.delete(projectId);
        }
        renderProjects();
      }
    }

    async function expandAllProjects() {
      const toLoad = [];
      state.projects.forEach(p => {
        state.expandedProjects.add(p.id);
        if (!state.projectSessions[p.id]) {
          state.loadingProjects.add(p.id);
          toLoad.push(loadProjectSessions(p.id).then(() => state.loadingProjects.delete(p.id)));
        }
      });
      renderProjects();
      if (toLoad.length > 0) {
        await Promise.all(toLoad);
        renderProjects();
      }
    }

    function collapseAllProjects() {
      state.expandedProjects.clear();
      renderProjects();
    }

    // ============== Streaming Logic ==============
    async function* streamChat(message, threadId, signal) {
      let skillsPayload = null;
      if (state.skillsMode === 'all') {
        skillsPayload = 'all';
      } else if (state.skillsMode === 'none') {
        skillsPayload = [];
      } else if (state.skillsMode === 'custom') {
        skillsPayload = Array.isArray(state.skillsList) ? state.skillsList : [];
      }

      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          message, 
          thread_id: threadId,
          project_id: state.activeProjectId || null,
          response_mode: state.enableBlocks ? 'blocks' : 'normal',
          setting_sources: state.settingSources,
          skills: skillsPayload,
          permission_mode: state.permissionMode,
        }),
        signal,
      });

      if (!response.ok) {
        throw new Error(`Server returned error ${response.status}`);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      try {
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split('\n\n');
          buffer = parts.pop() || '';

          for (const part of parts) {
            const lines = part.split('\n');
            let currentEvent = null;
            let eventData = null;

            for (const line of lines) {
              if (line.startsWith('event: ')) {
                currentEvent = line.slice(7).trim();
              } else if (line.startsWith('data: ')) {
                try {
                  eventData = JSON.parse(line.slice(6).trim());
                } catch (e) {}
              }
            }

            if (currentEvent && eventData !== null) {
              yield { event: currentEvent, data: eventData };
            }
          }
        }
      } finally {
        reader.releaseLock();
      }
    }

    function clearToolCalls() {}

    // ============== Blocks Audio Walkthrough Player ==============
    const audioPlayer = {
      isPlaying: false,
      groupId: null,
      currentIndex: 0,
      rate: 1.0,
      blocks: [],
      threadId: null,
    };

    function getBlockGroups(blocks) {
      if (!blocks || blocks.length === 0) return [];
      const groups = [];
      let currentGroup = [];
      let currentParentUuid = null;

      for (const b of blocks) {
        const isNewGroup = (b.parentUuid && currentParentUuid && b.parentUuid !== currentParentUuid) ||
                           (!b.parentUuid && b.sequence_id === 1 && currentGroup.length > 0);

        if (isNewGroup && currentGroup.length > 0) {
          groups.push(currentGroup);
          currentGroup = [];
        }
        currentParentUuid = b.parentUuid || null;
        currentGroup.push(b);
      }
      if (currentGroup.length > 0) {
        groups.push(currentGroup);
      }
      return groups;
    }

    function stopBlocksAudio() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      audioPlayer.isPlaying = false;
      audioPlayer.groupId = null;
      document.querySelectorAll('.block-card-container').forEach(card => {
        card.classList.remove('ring-2', 'ring-brand', 'border-brand', 'shadow-glow');
        const playBtn = card.querySelector('.block-play-btn');
        if (playBtn) {
          playBtn.className = 'block-play-btn flex items-center gap-1 text-[11px] text-brand hover:text-brand-hover bg-brand/10 hover:bg-brand/20 px-2 py-0.5 rounded border border-brand/20 transition-colors';
          playBtn.innerHTML = `<svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span>Listen</span>`;
        }
      });
      updateAllAudioPlayerBarsUI();
    }

    function updateAllAudioPlayerBarsUI() {
      document.querySelectorAll('.turn-audio-player').forEach(bar => {
        const barGroupId = parseInt(bar.dataset.groupId, 10);
        const playIcon = bar.querySelector('.turn-play-icon');
        const playLabel = bar.querySelector('.turn-play-label');
        const statusText = bar.querySelector('.turn-audio-status');
        const speedBtn = bar.querySelector('.turn-speed-btn');

        if (speedBtn) speedBtn.textContent = `${audioPlayer.rate}x`;

        if (audioPlayer.isPlaying && audioPlayer.groupId === barGroupId) {
          if (playIcon) playIcon.innerHTML = `<path stroke="currentColor" stroke-width="2.5" stroke-linecap="round" d="M10 6v12M14 6v12"/>`;
          if (playLabel) playLabel.textContent = 'Pause';
          if (statusText) {
            const curSeq = audioPlayer.blocks[audioPlayer.currentIndex]?.sequence_id ?? (audioPlayer.currentIndex + 1);
            statusText.innerHTML = `· <span class="text-brand font-medium">Playing ${curSeq}/${audioPlayer.blocks.length}</span>`;
          }
        } else {
          if (playIcon) playIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
          if (playLabel) playLabel.textContent = 'Play All';
          if (statusText) statusText.textContent = '';
        }
      });
    }

    function playBlockAtIndex(index, blocks, threadId, groupId = 0) {
      if (!('speechSynthesis' in window) || !blocks || blocks.length === 0) return;
      if (index < 0 || index >= blocks.length) {
        stopBlocksAudio();
        return;
      }

      window.speechSynthesis.cancel();
      audioPlayer.blocks = blocks;
      audioPlayer.threadId = threadId;
      audioPlayer.groupId = groupId;
      audioPlayer.currentIndex = index;
      audioPlayer.isPlaying = true;

      // Update block highlights
      document.querySelectorAll('.block-card-container').forEach(card => {
        const cardGroupId = parseInt(card.dataset.groupId, 10);
        const cardIndex = parseInt(card.dataset.blockIdx, 10);
        const isCurrent = cardGroupId === groupId && cardIndex === index;

        card.classList.toggle('ring-2', isCurrent);
        card.classList.toggle('ring-brand', isCurrent);
        card.classList.toggle('border-brand', isCurrent);
        card.classList.toggle('shadow-glow', isCurrent);

        const playBtn = card.querySelector('.block-play-btn');
        if (playBtn) {
          if (isCurrent) {
            playBtn.className = 'block-play-btn flex items-center gap-1 text-[11px] text-white bg-brand px-2 py-0.5 rounded border border-brand transition-colors';
            playBtn.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span><span>Playing</span>`;
          } else {
            playBtn.className = 'block-play-btn flex items-center gap-1 text-[11px] text-brand hover:text-brand-hover bg-brand/10 hover:bg-brand/20 px-2 py-0.5 rounded border border-brand/20 transition-colors';
            playBtn.innerHTML = `<svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span>Listen</span>`;
          }
        }

        if (isCurrent) {
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      });

      updateAllAudioPlayerBarsUI();

      const block = blocks[index];
      const textToSpeak = block.spoken_explanation || block.markdown || '';
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.rate = audioPlayer.rate;

      utterance.onend = () => {
        if (!audioPlayer.isPlaying || audioPlayer.groupId !== groupId) return;
        if (index + 1 < blocks.length) {
          playBlockAtIndex(index + 1, blocks, threadId, groupId);
        } else {
          stopBlocksAudio();
        }
      };

      utterance.onerror = () => {
        stopBlocksAudio();
      };

      window.speechSynthesis.speak(utterance);
    }

    function renderTurnAudioBar(turnBlocks, threadId, groupId = 0) {
      if (!turnBlocks || turnBlocks.length === 0) return;
      const bar = document.createElement('div');
      bar.className = 'turn-audio-player animate-msg w-full max-w-3xl lg:max-w-4xl mx-auto bg-dark-surface border border-dark-border hover:border-brand/40 rounded-xl px-3 py-2 mb-4 flex items-center justify-between gap-2 text-xs transition-colors';
      bar.dataset.groupId = groupId;
      bar.innerHTML = `
        <div class="flex items-center gap-2 min-w-0">

            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"/>

            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>

          <button class="turn-speed-btn px-1.5 py-0.5 rounded-md bg-dark-elevated text-txt-subtle hover:text-white font-mono text-[10px] transition-colors" title="Playback speed">
            ${audioPlayer.rate}x
          </button>
          <button class="turn-stop-btn p-1 rounded-md bg-dark-elevated hover:text-red-400 text-txt-subtle transition-colors" title="Stop">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 6h12v12H6z"/></svg>
          </button>

      `;

      bar.querySelector('.turn-play-btn')?.addEventListener('click', () => {
        if (audioPlayer.isPlaying && audioPlayer.groupId === groupId) {
          stopBlocksAudio();
        } else {
          playBlockAtIndex(audioPlayer.groupId === groupId ? audioPlayer.currentIndex : 0, turnBlocks, threadId, groupId);
        }
      });

      bar.querySelector('.turn-prev-btn')?.addEventListener('click', () => {
        const cur = audioPlayer.groupId === groupId ? audioPlayer.currentIndex : 0;
        const prevIdx = Math.max(0, cur - 1);
        playBlockAtIndex(prevIdx, turnBlocks, threadId, groupId);
      });

      bar.querySelector('.turn-next-btn')?.addEventListener('click', () => {
        const cur = audioPlayer.groupId === groupId ? audioPlayer.currentIndex : -1;
        const nextIdx = Math.min(turnBlocks.length - 1, cur + 1);
        playBlockAtIndex(nextIdx, turnBlocks, threadId, groupId);
      });

      bar.querySelector('.turn-speed-btn')?.addEventListener('click', (e) => {
        const speeds = [1.0, 1.25, 1.5, 2.0];
        const nextSpeed = speeds[(speeds.indexOf(audioPlayer.rate) + 1) % speeds.length];
        audioPlayer.rate = nextSpeed;
        updateAllAudioPlayerBarsUI();
        if (audioPlayer.isPlaying && audioPlayer.groupId === groupId) {
          playBlockAtIndex(audioPlayer.currentIndex, turnBlocks, threadId, groupId);
        }
      });

      bar.querySelector('.turn-stop-btn')?.addEventListener('click', () => {
        stopBlocksAudio();
      });

      el.messagesContainer.appendChild(bar);
    }

    function renderBlockNode(block, threadId, index = 0, groupId = 0) {
      const wrapper = document.createElement('div');
      wrapper.className = 'animate-msg w-full max-w-3xl lg:max-w-4xl mx-auto mb-4 min-w-0';

      }

            <button type="button" class="block-play-btn flex items-center gap-1 text-[11px] text-brand hover:text-brand-hover bg-brand/10 hover:bg-brand/20 px-2 py-0.5 rounded border border-brand/20 transition-colors" data-block-idx="${index}" data-group-id="${groupId}">
              <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>

        playBtn.addEventListener('click', () => {

          playBlockAtIndex(index, turnBlocks, threadId, groupId);
