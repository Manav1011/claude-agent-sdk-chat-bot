    // Persistent Loading Bar State Control
    let activeLoadingNode = null;

    function showLoadingIndicator() {
      if (activeLoadingNode) return;

      activeLoadingNode = document.createElement('div');
      activeLoadingNode.id = 'active-loader';
      activeLoadingNode.className = 'animate-msg flex items-center gap-3 mb-4 w-full max-w-3xl lg:max-w-4xl mx-auto';
      activeLoadingNode.innerHTML = `
        <div class="w-7 h-7 rounded-lg bg-brand/20 border border-brand-border flex items-center justify-center shrink-0 text-brand">
          <svg class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </div>
        <div class="bg-dark-surface border border-dark-border rounded-xl px-4 py-2.5 flex items-center gap-2">
          <span class="flex gap-1 items-center">
            <span class="w-1.5 h-1.5 rounded-full bg-brand pulse-dot"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-brand pulse-dot"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-brand pulse-dot"></span>
          </span>
          <span class="text-xs text-txt-muted font-medium">Agent is processing...</span>
        </div>
      `;
      el.messagesContainer.appendChild(activeLoadingNode);
      scrollToBottom();
    }

    function hideLoadingIndicator() {
      if (activeLoadingNode) {
        activeLoadingNode.remove();
        activeLoadingNode = null;
      }
    }

    function showError(message) {
      hideLoadingIndicator();
      const wrapper = document.createElement('div');
      wrapper.className = 'animate-msg flex justify-start mb-4 w-full max-w-3xl lg:max-w-4xl mx-auto';
      wrapper.innerHTML = `
        <div class="bg-red-500/10 border border-red-500/30 rounded-xl px-4 py-3 max-w-[85%] text-xs text-red-400">
          <span class="font-semibold block mb-1">Execution Error</span>
          ${escapeHtml(message)}
        </div>
      `;
      el.messagesContainer.appendChild(wrapper);
      scrollToBottom();
    }

    // ============== Utilities ==============
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatJson(val) {
      if (typeof val === 'object') return JSON.stringify(val, null, 2);
      try {
        return JSON.stringify(JSON.parse(val), null, 2);
      } catch {
        return String(val);
      }
    }

    let _scrollRafPending = false;
    function scrollToBottom() {
      if (_scrollRafPending) return;
      _scrollRafPending = true;
      requestAnimationFrame(() => {
        el.messagesContainer.scrollTop = el.messagesContainer.scrollHeight;
        _scrollRafPending = false;
      });
    }

    function updateSessionTokensWidget() {
      // Legacy — tokens now shown via context bar
    }

    function renderCurrentSessionView(threadId = state.currentThreadId) {
      if (!threadId) return;
      el.messagesContainer.innerHTML = '';
      clearToolCalls();

      const messages = state.messages[threadId] || [];
      const blocks = state.blocks[threadId] || [];
      const hasBlocks = blocks.length > 0;
      const cleanMessages = messages.filter(m => {
        if (typeof m.content !== 'string') return true;
        if (m.content.startsWith('Stop hook feedback:')) return false;
        if (m.content.startsWith('[structured-output-enforce]')) return false;
        if (m.content.includes('You MUST call the StructuredOutput tool')) return false;
        return true;
      });
      const regularMessages = cleanMessages.filter(m => m.type !== 'tool_result');

      if (regularMessages.length === 0 && !hasBlocks) {
        el.emptyState.style.display = 'flex';
        el.messagesContainer.appendChild(el.emptyState);
        return;
      }

      el.emptyState.style.display = 'none';

      if (state.currentMode === 'blocks') {
        const groups = getBlockGroups(blocks);
        const humanMessages = cleanMessages.filter(m => m.type === 'human');

        if (hasBlocks) {
          if (humanMessages.length > 0) {
            humanMessages.forEach((hMsg, gIdx) => {
              renderMessageNode(hMsg);
              const turnBlocks = groups[gIdx];
              if (turnBlocks && turnBlocks.length > 0) {
                renderTurnAudioBar(turnBlocks, threadId, gIdx);
                turnBlocks.forEach((b, bIdx) => {
                  renderBlockNode(b, threadId, bIdx, gIdx);
                });
              }
            });
            for (let gIdx = humanMessages.length; gIdx < groups.length; gIdx++) {
              const turnBlocks = groups[gIdx];
              if (turnBlocks && turnBlocks.length > 0) {
                renderTurnAudioBar(turnBlocks, threadId, gIdx);
                turnBlocks.forEach((b, bIdx) => {
                  renderBlockNode(b, threadId, bIdx, gIdx);
                });
              }
            }
          } else {
            groups.forEach((turnBlocks, gIdx) => {
              renderTurnAudioBar(turnBlocks, threadId, gIdx);
              turnBlocks.forEach((b, bIdx) => {
                renderBlockNode(b, threadId, bIdx, gIdx);
              });
            });
          }
        } else {
          for (const hMsg of humanMessages) {
            renderMessageNode(hMsg);
          }
          const noBlocksEl = document.createElement('div');
          noBlocksEl.className = 'animate-msg flex items-center justify-center p-8 text-center text-xs text-txt-subtle border border-dashed border-dark-border rounded-2xl my-4 w-full max-w-3xl lg:max-w-4xl mx-auto';
          noBlocksEl.textContent = 'No blocks in this session';
          el.messagesContainer.appendChild(noBlocksEl);
        }
      } else {
        for (const msg of cleanMessages) {
          renderMessageNode(msg);
        }
      }
    }

    async function selectSession(threadId) {
      if (window.innerWidth < 1024) {
        el.sidebar?.classList.add('-translate-x-full');
        el.sidebarBackdrop?.classList.add('hidden');
      }
      stopBlocksAudio();
      setCurrentThread(threadId);
      renderProjects();
      state.contextUsage = null;
      updateContextBar(null);

      el.messagesContainer.innerHTML = '';
      showLoadingIndicator();

      try {
        const projectParam = state.activeProjectId ? `?project_id=${state.activeProjectId}` : '';
        const res = await fetch(`/api/sessions/${threadId}/messages${projectParam}`);
        hideLoadingIndicator();

        if (res.ok) {
          const data = await res.json();
          state.messages[threadId] = data.messages || [];

          const blocks = data.enriched_blocks || null;
          if (blocks && Array.isArray(blocks) && blocks.length > 0) {
            state.blocks[threadId] = blocks;
          }

          renderCurrentSessionView(threadId);
        }
      } catch (e) {
        hideLoadingIndicator();
        showError('Failed to load session messages from server.');
      }
      updateSessionTokensWidget();
    }

    function startNewChat() {
      if (window.innerWidth < 1024) {
        el.sidebar?.classList.add('-translate-x-full');
        el.sidebarBackdrop?.classList.add('hidden');
      }
      stopBlocksAudio();
      // Abort any in-progress stream
      if (state.abortController) {
        state.abortController.abort();
        state.abortController = null;
        state.isStreaming = false;
      }
      clearToolCalls();
      state.contextUsage = null;
      updateContextBar(null);
      setCurrentThread(null);
      renderProjects();
      el.messagesContainer.innerHTML = '';
      el.messagesContainer.appendChild(el.emptyState);
      el.emptyState.style.display = 'flex';
      updateSessionTokensWidget();
      el.messageInput.focus();
    }

    async function deleteSession(threadId, projectId) {
      stopBlocksAudio();
      try {
        await fetch(`/api/sessions/${threadId}`, { method: 'DELETE' });
      } catch (e) {}

      if (projectId && state.projectSessions[projectId]) {
        state.projectSessions[projectId] = state.projectSessions[projectId].filter(s => s.thread_id !== threadId);
      }
      delete state.messages[threadId];
      delete state.blocks[threadId];

      if (state.currentThreadId === threadId) {
        startNewChat();
      } else {
        renderProjects();
      }
    }

    async function sendMessage(overrideText = null) {
      const text = (overrideText || el.messageInput.value).trim();
      if (!text || state.isStreaming) return;

      el.messageInput.value = '';
      el.messageInput.style.height = 'auto';
      el.sendBtn.disabled = true;
      state.isStreaming = true;
      setMode(state.enableBlocks ? 'blocks' : 'normal');

      // Hide empty screen
      el.emptyState.style.display = 'none';

      // Ensure thread ID
      const isNewSession = !state.currentThreadId;
      if (!state.currentThreadId) {
        state.currentThreadId = `session-${Date.now().toString(36)}`;
      }

      // Add user message node
      const userMsg = { type: 'human', content: text };
      renderMessageNode(userMsg);
      if (!state.messages[state.currentThreadId]) {
        state.messages[state.currentThreadId] = [];
      }
      state.messages[state.currentThreadId].push(userMsg);

      // Show loader
      showLoadingIndicator();

      // Create AbortController for cancellation support
      state.abortController = new AbortController();

      try {
        let activeAiWrapper = null;
        let activeAiTextEl = null;
        let activeThinkingTextEl = null;

        for await (const { event, data } of streamChat(text, state.currentThreadId, state.abortController.signal)) {
          if (event === 'message') {
            if (data.type === 'human') continue;
            if (data.type === 'context_usage') {
              state.contextUsage = data.data;
              updateContextBar(data.data);
              continue;
            }

            if (state.currentMode === 'blocks') {
              if (data.type === 'text_delta' || data.type === 'thinking_delta') {
                continue;
              }
            } else {
              if (data.type === 'content_block') {
                continue;
              }
            }

            hideLoadingIndicator();

            if (data.type === 'text_delta') {
              if (!activeAiWrapper) {
                activeAiWrapper = document.createElement('div');
                activeAiWrapper.className = 'animate-msg w-full max-w-3xl lg:max-w-4xl mx-auto mb-4 min-w-0';
                activeAiWrapper.innerHTML = `
                  <div class="prose-dark ai-content-body min-w-0 max-w-full overflow-hidden break-words px-1 py-1">
                  </div>
                `;
                activeAiTextEl = activeAiWrapper.querySelector('.ai-content-body');
                activeAiTextEl.dataset.raw = '';
                el.messagesContainer.appendChild(activeAiWrapper);
              }

              activeAiTextEl.dataset.raw += data.content;
              // Debounce markdown re-rendering with requestAnimationFrame
              if (!activeAiTextEl._rafPending) {
                activeAiTextEl._rafPending = true;
                requestAnimationFrame(() => {
                  activeAiTextEl.innerHTML = marked.parse(activeAiTextEl.dataset.raw);
                  activeAiTextEl._rafPending = false;
                  scrollToBottom();
                });
              }
            }
            else if (data.type === 'thinking_delta') {
              if (!activeThinkingTextEl) {
                const thinkWrapper = document.createElement('div');
                thinkWrapper.className = 'animate-msg w-full max-w-3xl lg:max-w-4xl mx-auto mb-3 min-w-0';
                thinkWrapper.innerHTML = `
                  <div class="bg-dark-surface/40 border border-dark-border/60 rounded-xl px-3.5 py-2 text-xs font-mono min-w-0 max-w-full overflow-hidden">
                    <details class="group" open>
                      <summary class="flex items-center justify-between cursor-pointer text-txt-subtle hover:text-txt-muted select-none">
                        <span class="text-[11px] font-sans font-medium text-txt-subtle">Thought Process</span>
                        <svg class="w-3.5 h-3.5 transition-transform group-open:rotate-180 text-txt-subtle shrink-0 ml-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                      </summary>
                      <div class="thinking-body mt-2 pt-2 border-t border-dark-border/40 text-txt-muted whitespace-pre-wrap leading-relaxed text-[11px] break-words overflow-x-auto"></div>
                    </details>
                  </div>
                `;
                activeThinkingTextEl = thinkWrapper.querySelector('.thinking-body');
                el.messagesContainer.appendChild(thinkWrapper);
              }
              activeThinkingTextEl.textContent += data.content;
              scrollToBottom();
            }
            else if (data.type === 'content_block') {
              activeAiWrapper = null;
              activeAiTextEl = null;
              activeThinkingTextEl = null;
              if (!state.blocks[state.currentThreadId]) {
                state.blocks[state.currentThreadId] = [];
              }
              state.blocks[state.currentThreadId].push(data);
              renderBlockNode(data, state.currentThreadId);
              showLoadingIndicator();
            }
            else if (data.type === 'tool_result') {
              activeAiWrapper = null;
              activeAiTextEl = null;
              activeThinkingTextEl = null;
              if (!state.messages[state.currentThreadId]) {
                state.messages[state.currentThreadId] = [];
              }
              state.messages[state.currentThreadId].push(data);
              renderToolCallNode(data);
              showLoadingIndicator();
            }
            else {
              activeAiWrapper = null;
              activeAiTextEl = null;
              activeThinkingTextEl = null;
              renderMessageNode(data);
              showLoadingIndicator();
            }
          } else if (event === 'done') {
            hideLoadingIndicator();
            const threadChanged = data.thread_id && data.thread_id !== state.currentThreadId;
            if (threadChanged) {
              setCurrentThread(data.thread_id);
            }
            if (data.usage) {
              if (activeAiTextEl) {
                const usageBadge = document.createElement('div');
                usageBadge.className = 'mt-3 pt-2 border-t border-dark-border/60 flex items-center gap-3 font-mono text-[10px] text-txt-subtle';
                usageBadge.innerHTML = `
                  <span title="Input tokens">in: <strong class="text-txt-muted">${data.usage.input_tokens || 0}</strong></span>
                  <span title="Output tokens">out: <strong class="text-txt-muted">${data.usage.output_tokens || 0}</strong></span>
                  <span title="Total tokens">total: <strong class="text-brand">${data.usage.total_tokens || 0}</strong></span>
                `;
                activeAiTextEl.appendChild(usageBadge);
              }

              // Update token stats directly in memory without extra API requests
              if (!state.messages[state.currentThreadId]) {
                state.messages[state.currentThreadId] = [];
              }
              state.messages[state.currentThreadId].push({ usage: data.usage });
              updateSessionTokensWidget();
            }
            if (data.response_mode === 'blocks') {
              renderCurrentSessionView(state.currentThreadId);
            } else if (state.currentMode === 'blocks') {
              showNotification('LLM did not return structured blocks; displayed in normal mode.', 'info');
            }
            if (isNewSession || threadChanged) {
              if (state.activeProjectId) {
                await loadProjectSessions(state.activeProjectId);
                renderProjects();
              }
            }
          } else if (event === 'error') {
            showError(data.message || 'Stream processing failed');
          }
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          showError(err.message || 'Failed to communicate with agent server');
        }
      } finally {
        hideLoadingIndicator();
        state.isStreaming = false;
        state.abortController = null;
        el.sendBtn.disabled = el.messageInput.value.trim().length === 0;
        el.messageInput.focus();
      }
    }

    // ============== Notifications ==============
    function showNotification(message, type = 'info') {
      const notification = document.createElement('div');
      const colors = {
        success: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30',
        error: 'bg-red-500/10 text-red-400 border-red-500/30',
        info: 'bg-blue-500/10 text-blue-400 border-blue-500/30',
      };
      notification.className = `fixed bottom-4 right-4 z-50 px-4 py-2 rounded-lg text-xs font-mono border ${colors[type] || colors.info} shadow-lg animate-msg`;
      notification.textContent = message;
      document.body.appendChild(notification);
      setTimeout(() => {
        notification.style.opacity = '0';
        notification.style.transition = 'opacity 0.3s';
        setTimeout(() => notification.remove(), 300);
      }, 3000);
    }

    // ============== Listeners ==============
    el.sendBtn.addEventListener('click', () => sendMessage());

    el.messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    el.messageInput.addEventListener('input', () => {
      // Auto expand textarea height
      el.messageInput.style.height = 'auto';
      el.messageInput.style.height = Math.min(el.messageInput.scrollHeight, 192) + 'px';

      el.sendBtn.disabled = el.messageInput.value.trim().length === 0 || state.isStreaming;
    });

    el.expandAllBtn?.addEventListener('click', expandAllProjects);
    el.collapseAllBtn?.addEventListener('click', collapseAllProjects);

    el.addProjectBtn?.addEventListener('click', () => {
      el.addProjectForm?.classList.toggle('hidden');
      if (!el.addProjectForm?.classList.contains('hidden')) {
        el.newProjectPathInput?.focus();
      }
    });

    el.cancelAddProjectBtn?.addEventListener('click', () => {
      el.addProjectForm?.classList.add('hidden');
      if (el.newProjectPathInput) el.newProjectPathInput.value = '';
      if (el.newProjectNameInput) el.newProjectNameInput.value = '';
    });

    const handleAddProjectSubmit = async () => {
      const path = el.newProjectPathInput?.value;
      const name = el.newProjectNameInput?.value;
      const success = await addNewProject(name, path);
      if (success) {
        el.addProjectForm?.classList.add('hidden');
        if (el.newProjectPathInput) el.newProjectPathInput.value = '';
        if (el.newProjectNameInput) el.newProjectNameInput.value = '';
      }
    };

    el.submitAddProjectBtn?.addEventListener('click', handleAddProjectSubmit);
    el.newProjectPathInput?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleAddProjectSubmit();
    });
    el.newProjectNameInput?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleAddProjectSubmit();
    });

    el.settingsBtn?.addEventListener('click', showSettingsModal);
    el.modeNormalBtn?.addEventListener('click', () => setMode('normal'));
    el.modeBlocksBtn?.addEventListener('click', () => setMode('blocks'));

    // ============== Settings Modal ==============
    function showSettingsModal() {
      const existing = document.getElementById('settings-modal');
      if (existing) existing.remove();

      const modal = document.createElement('div');
      modal.id = 'settings-modal';
      modal.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm animate-msg p-4';
      
      const currentSources = state.settingSources ? (state.settingSources.includes('user') ? 'user' : (state.settingSources.includes('local') ? 'local' : 'default')) : 'default';
      const currentPerm = state.permissionMode || 'default';
      const currentSkillsMode = state.skillsMode || 'default';

      modal.innerHTML = `
        <div class="bg-dark-surface border border-dark-border rounded-2xl p-5 w-full max-w-lg shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
          <!-- Header -->
          <div class="flex items-center justify-between pb-3 border-b border-dark-border/60">
            <div class="flex items-center gap-2">
              <svg class="w-4 h-4 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
              <h3 class="font-medium text-sm text-white">Agent & Session Settings</h3>
            </div>
            <button id="close-settings-btn" class="text-txt-subtle hover:text-white p-1 rounded-lg hover:bg-dark-elevated transition-colors text-base leading-none">&times;</button>
          </div>

          <div class="space-y-3.5 py-1">
            
            <!-- 1. Permission Mode -->
            <div class="p-3 rounded-xl bg-dark-elevated/40 border border-dark-border/60 space-y-2">
              <div class="flex items-center justify-between">
                <div>
                  <div class="text-xs font-medium text-white">Permission Mode</div>
                  <div class="text-[11px] text-txt-subtle">Controls what the agent is allowed to do</div>
                </div>
              </div>
              <div class="grid grid-cols-3 gap-1 bg-dark-bg/80 p-1 rounded-lg border border-dark-border/60 text-[11px] font-medium">
                <button type="button" class="perm-option py-1 rounded transition-colors text-center ${currentPerm === 'default' ? 'bg-brand text-white shadow-sm' : 'text-txt-subtle hover:text-white'}" data-val="default">Default</button>
                <button type="button" class="perm-option py-1 rounded transition-colors text-center ${currentPerm === 'plan' ? 'bg-brand text-white shadow-sm' : 'text-txt-subtle hover:text-white'}" data-val="plan">Read-Only</button>
                <button type="button" class="perm-option py-1 rounded transition-colors text-center ${currentPerm === 'bypassPermissions' ? 'bg-brand text-white shadow-sm' : 'text-txt-subtle hover:text-white'}" data-val="bypassPermissions">Full Access</button>
              </div>
              <div id="perm-desc" class="text-[10px] text-txt-subtle font-mono"></div>
            </div>

            <!-- 2. Settings Sources -->
            <div class="p-3 rounded-xl bg-dark-elevated/40 border border-dark-border/60 space-y-2">
              <div class="flex items-center justify-between">
                <div>
                  <div class="text-xs font-medium text-white">Settings Sources</div>
                  <div class="text-[11px] text-txt-subtle">Choose which Claude config files to load</div>
                </div>
              </div>
              <div class="grid grid-cols-3 gap-1 bg-dark-bg/80 p-1 rounded-lg border border-dark-border/60 text-[11px] font-medium">
                <button type="button" class="source-option py-1 rounded transition-colors text-center ${currentSources === 'default' ? 'bg-brand text-white shadow-sm' : 'text-txt-subtle hover:text-white'}" data-val="default">Default (All)</button>
                <button type="button" class="source-option py-1 rounded transition-colors text-center ${currentSources === 'user' ? 'bg-brand text-white shadow-sm' : 'text-txt-subtle hover:text-white'}" data-val="user">User (~/.claude)</button>
                <button type="button" class="source-option py-1 rounded transition-colors text-center ${currentSources === 'local' ? 'bg-brand text-white shadow-sm' : 'text-txt-subtle hover:text-white'}" data-val="local">Local (.claude)</button>
              </div>
              <div id="source-desc" class="text-[10px] text-txt-subtle font-mono"></div>
            </div>

            <!-- 3. Skills Configurations -->
            <div class="p-3 rounded-xl bg-dark-elevated/40 border border-dark-border/60 space-y-2.5">
              <div class="flex items-center justify-between">
                <div>
                  <div class="text-xs font-medium text-white">Skills Configuration</div>
                  <div class="text-[11px] text-txt-subtle">Controls which skills are available in the session</div>
                </div>
              </div>
              <div class="grid grid-cols-4 gap-1 bg-dark-bg/80 p-1 rounded-lg border border-dark-border/60 text-[10px] sm:text-[11px] font-medium">
                <button type="button" class="skills-mode-btn py-1 rounded transition-colors text-center ${currentSkillsMode === 'default' ? 'bg-brand text-white shadow-sm' : 'text-txt-subtle hover:text-white'}" data-mode="default">Default</button>
                <button type="button" class="skills-mode-btn py-1 rounded transition-colors text-center ${currentSkillsMode === 'all' ? 'bg-brand text-white shadow-sm' : 'text-txt-subtle hover:text-white'}" data-mode="all">All Skills</button>
                <button type="button" class="skills-mode-btn py-1 rounded transition-colors text-center ${currentSkillsMode === 'none' ? 'bg-brand text-white shadow-sm' : 'text-txt-subtle hover:text-white'}" data-mode="none">No Skills</button>
                <button type="button" class="skills-mode-btn py-1 rounded transition-colors text-center ${currentSkillsMode === 'custom' ? 'bg-brand text-white shadow-sm' : 'text-txt-subtle hover:text-white'}" data-mode="custom">Custom</button>
              </div>

              <!-- Custom Skills Tag Input Container (shown when mode === 'custom') -->
              <div id="custom-skills-container" class="space-y-2 pt-1 ${currentSkillsMode === 'custom' ? '' : 'hidden'}">
                <div class="flex items-center gap-1.5">
                  <input id="new-skill-input" type="text" placeholder="e.g. writing-plans, agent-reach..." class="flex-1 bg-dark-bg border border-dark-border rounded-lg px-2.5 py-1 text-xs text-white placeholder-txt-subtle focus:outline-none focus:border-brand/60 font-mono" />
                  <button id="add-skill-btn" type="button" class="px-2.5 py-1 bg-brand hover:bg-brand-hover text-white rounded-lg text-xs font-medium transition-colors">Add</button>
                </div>
                <div id="skills-tags-list" class="flex flex-wrap gap-1.5 max-h-28 overflow-y-auto p-1.5 bg-dark-bg/60 rounded-lg border border-dark-border/40 min-h-[32px]"></div>
              </div>
              <div id="skills-desc" class="text-[10px] text-txt-subtle font-mono"></div>
            </div>

            <!-- 4. Blocks Mode Toggle -->
            <div class="flex items-center justify-between p-3 rounded-xl bg-dark-elevated/40 border border-dark-border/60">
              <div class="space-y-0.5 pr-4">
                <div class="text-xs font-medium text-white">Blocks Mode by Default</div>
                <div class="text-[11px] text-txt-subtle leading-relaxed">Request structured explanation cards with audio walkthrough for new responses.</div>
              </div>
              <button id="modal-blocks-toggle" type="button" class="relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${state.enableBlocks ? 'bg-brand' : 'bg-dark-border'}">
                <span class="pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out ${state.enableBlocks ? 'translate-x-4' : 'translate-x-0'}"></span>
              </button>
            </div>

          </div>

          <div class="pt-2 flex justify-end">
            <button id="done-settings-btn" class="px-4 py-1.5 rounded-lg bg-brand hover:bg-brand-hover text-white text-xs font-medium transition-colors shadow-sm">Done</button>
          </div>
        </div>
      `;

      modal.querySelector('#close-settings-btn')?.addEventListener('click', () => modal.remove());
      modal.querySelector('#done-settings-btn')?.addEventListener('click', () => modal.remove());
      modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });

      // Permission Mode logic
      const permDescEl = modal.querySelector('#perm-desc');
      const updatePermDesc = () => {
        const val = state.permissionMode;
        if (!val) permDescEl.textContent = 'null (SDK Default: Standard tool permission checks)';
        else if (val === 'plan') permDescEl.textContent = '"plan" (Read-only: Read, Glob, Grep only)';
        else if (val === 'bypassPermissions') permDescEl.textContent = '"bypassPermissions" (Full Access: All tool checks bypassed)';
      };
      updatePermDesc();

      modal.querySelectorAll('.perm-option').forEach(btn => {
        btn.addEventListener('click', () => {
          const val = btn.dataset.val;
          state.permissionMode = val === 'default' ? null : val;
          if (state.permissionMode) {
            localStorage.setItem('qa-permission-mode', state.permissionMode);
          } else {
            localStorage.removeItem('qa-permission-mode');
          }
          modal.querySelectorAll('.perm-option').forEach(b => {
            b.className = `perm-option py-1 rounded transition-colors text-center ${b.dataset.val === (state.permissionMode || 'default') ? 'bg-brand text-white shadow-sm' : 'text-txt-subtle hover:text-white'}`;
          });
          updatePermDesc();
        });
      });

      // Settings Sources logic
      const sourceDescEl = modal.querySelector('#source-desc');
      const updateSourceDesc = () => {
        const s = state.settingSources;
        if (!s) sourceDescEl.textContent = 'null (Loads user + project + local settings — SDK default)';
        else if (s.includes('user')) sourceDescEl.textContent = '["user"] (Only load ~/.claude/settings.json)';
        else if (s.includes('local')) sourceDescEl.textContent = '["local"] (Only load .claude/settings.local.json)';
      };
      updateSourceDesc();

      modal.querySelectorAll('.source-option').forEach(btn => {
        btn.addEventListener('click', () => {
          const val = btn.dataset.val;
          if (val === 'default') {
            state.settingSources = null;
            localStorage.removeItem('qa-setting-sources');
          } else if (val === 'user') {
            state.settingSources = ['user'];
            localStorage.setItem('qa-setting-sources', 'user');
          } else if (val === 'local') {
            state.settingSources = ['local'];
            localStorage.setItem('qa-setting-sources', 'local');
          }
          const curVal = state.settingSources ? (state.settingSources.includes('user') ? 'user' : 'local') : 'default';
          modal.querySelectorAll('.source-option').forEach(b => {
            b.className = `source-option py-1 rounded transition-colors text-center ${b.dataset.val === curVal ? 'bg-brand text-white shadow-sm' : 'text-txt-subtle hover:text-white'}`;
          });
          updateSourceDesc();
        });
      });

      // Skills Configuration logic
      const skillsContainer = modal.querySelector('#custom-skills-container');
      const tagsList = modal.querySelector('#skills-tags-list');
      const skillInput = modal.querySelector('#new-skill-input');
      const addSkillBtn = modal.querySelector('#add-skill-btn');
      const skillsDescEl = modal.querySelector('#skills-desc');

      const renderSkillsTags = () => {
        if (!tagsList) return;
        tagsList.innerHTML = '';
        const list = state.skillsList || [];
        if (list.length === 0) {
          tagsList.innerHTML = '<span class="text-[11px] text-txt-subtle italic p-1">No custom skills added (sends empty list [])</span>';
          return;
        }
        list.forEach((skillName, idx) => {
          const tag = document.createElement('span');
          tag.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-dark-surface border border-dark-border text-white text-[11px] font-mono shadow-sm';
          tag.innerHTML = `
            <span>${escapeHtml(skillName)}</span>
            <button type="button" class="text-txt-subtle hover:text-red-400 font-sans ml-0.5 leading-none" data-idx="${idx}">&times;</button>
          `;
          tag.querySelector('button')?.addEventListener('click', () => {
            state.skillsList.splice(idx, 1);
            localStorage.setItem('qa-skills-list', JSON.stringify(state.skillsList));
            renderSkillsTags();
            updateSkillsDesc();
          });
          tagsList.appendChild(tag);
        });
      };

      const updateSkillsDesc = () => {
        if (!skillsDescEl) return;
        const mode = state.skillsMode || 'default';
        if (mode === 'default') skillsDescEl.textContent = 'null (SDK default: standard CLI discovery)';
        else if (mode === 'all') skillsDescEl.textContent = '"all" (Load every skill discovered on disk)';
        else if (mode === 'none') skillsDescEl.textContent = '[] (No skills at all: empty list)';
        else if (mode === 'custom') {
          const count = (state.skillsList || []).length;
          skillsDescEl.textContent = `[${(state.skillsList || []).map(s => `"${s}"`).join(', ')}] (${count} skills enabled)`;
        }
      };

      const addCustomSkill = () => {
        const val = skillInput?.value.trim();
        if (!val) return;
        if (!state.skillsList) state.skillsList = [];
        if (!state.skillsList.includes(val)) {
          state.skillsList.push(val);
          localStorage.setItem('qa-skills-list', JSON.stringify(state.skillsList));
          renderSkillsTags();
          updateSkillsDesc();
        }
        if (skillInput) skillInput.value = '';
      };

      addSkillBtn?.addEventListener('click', addCustomSkill);
      skillInput?.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          addCustomSkill();
        }
      });

      renderSkillsTags();
      updateSkillsDesc();

      modal.querySelectorAll('.skills-mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const mode = btn.dataset.mode;
          state.skillsMode = mode;
          localStorage.setItem('qa-skills-mode', mode);

          modal.querySelectorAll('.skills-mode-btn').forEach(b => {
            b.className = `skills-mode-btn py-1 rounded transition-colors text-center ${b.dataset.mode === mode ? 'bg-brand text-white shadow-sm' : 'text-txt-subtle hover:text-white'}`;
          });

          if (mode === 'custom') {
            skillsContainer?.classList.remove('hidden');
          } else {
            skillsContainer?.classList.add('hidden');
          }
          updateSkillsDesc();
        });
      });

      // Blocks toggle logic
      const toggleBtn = modal.querySelector('#modal-blocks-toggle');
      toggleBtn?.addEventListener('click', () => {
        state.enableBlocks = !state.enableBlocks;
        localStorage.setItem('qa-enable-blocks', state.enableBlocks);
        toggleBtn.className = `relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${state.enableBlocks ? 'bg-brand' : 'bg-dark-border'}`;
        const span = toggleBtn.querySelector('span');
        if (span) span.className = `pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out ${state.enableBlocks ? 'translate-x-4' : 'translate-x-0'}`;
      });

      document.body.appendChild(modal);
    }

    // ============== Context Usage ==============
    function updateContextBar(ctx) {
      if (!el.contextUsageBar) return;
      if (!ctx) {
        el.contextUsageBar.classList.add('hidden');
        el.contextUsageBar.classList.remove('flex');
        return;
      }
      const pct = ctx.percentage || 0;
      const totalBlocks = 20;
      const filled = Math.min(totalBlocks, Math.max(0, Math.round((pct / 100) * totalBlocks)));
      const empty = totalBlocks - filled;
      if (el.contextUsageBlocks) {
        el.contextUsageBlocks.innerHTML = `<span class="text-brand">${'█'.repeat(filled)}</span><span class="text-brand/35">${'░'.repeat(empty)}</span>`;
      }
      if (el.contextUsageLabel) {
        el.contextUsageLabel.textContent = pct + '%';
      }
      el.contextUsageBar.classList.remove('hidden');
      el.contextUsageBar.classList.add('flex');
    }

    function showContextModal() {
      const ctx = state.contextUsage;
      if (!ctx) return;
      const max = ctx.maxTokens || 180000;

      // Active categories (excluding free/inactive space)
      const INACTIVE = ['Free space', 'Autocompact buffer'];
      const activeCats = (ctx.categories || []).filter(c => !INACTIVE.includes(c.name));
      const inactiveCats = (ctx.categories || []).filter(c => INACTIVE.includes(c.name));

      const totalUsed = activeCats.reduce((s, c) => s + c.tokens, 0);
      const pct = max > 0 ? Math.round(totalUsed / max * 100) : 0;
      const totalFree = inactiveCats.reduce((s, c) => s + c.tokens, 0);

      // Build category rows (active only)
      const catRows = activeCats.map(c =>
        `<tr><td class="py-1 px-2">${c.name}</td><td class="py-1 px-2 text-right font-mono">${c.tokens.toLocaleString()}</td><td class="py-1 px-2 text-right text-txt-subtle">${max > 0 ? Math.round(c.tokens / max * 100) : 0}%</td></tr>`
      ).join('');

      const modal = document.createElement('div');
      modal.id = 'context-modal';
      modal.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm';
      modal.innerHTML = `
        <div class="bg-dark-elevated border border-dark-border rounded-2xl shadow-2xl w-80 max-h-[80vh] overflow-y-auto">
          <div class="p-4 border-b border-dark-border flex items-center justify-between">
            <h3 class="text-sm font-medium text-txt-main">Context Window</h3>
            <button onclick="this.closest('#context-modal').remove()" class="text-txt-subtle hover:text-txt-main">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>
          <div class="p-4">
            <div class="text-center mb-4">
              <div class="text-2xl font-bold text-brand">${totalUsed.toLocaleString()}</div>
              <div class="text-xs text-txt-subtle">of ${max.toLocaleString()} tokens (${pct}%)</div>
              <div class="w-full h-2 bg-dark-bg rounded-full mt-2 overflow-hidden border border-dark-border/50">
                <div class="h-full bg-brand rounded-full" style="width: ${pct}%"></div>
              </div>
            </div>
            <table class="w-full text-xs mb-4">
              <thead><tr class="text-txt-subtle border-b border-dark-border/50"><th class="text-left py-1 px-2 font-medium">Category</th><th class="text-right py-1 px-2 font-medium">Tokens</th><th class="text-right py-1 px-2 font-medium">%</th></tr></thead>
              <tbody class="text-txt-main">${catRows}</tbody>
            </table>
            <div class="border-t border-dark-border/50 pt-2">
              <div class="text-xs text-txt-subtle">Free space: <strong class="text-txt-main font-mono">${totalFree.toLocaleString()}</strong> tokens</div>
            </div>
          </div>
        </div>
      `;
      modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
      document.body.appendChild(modal);
    }

    el.menuToggle?.addEventListener('click', () => {
      el.sidebar?.classList.toggle('-translate-x-full');
      el.sidebarBackdrop?.classList.toggle('hidden');
    });

    el.sidebarBackdrop?.addEventListener('click', () => {
      el.sidebar?.classList.add('-translate-x-full');
      el.sidebarBackdrop?.classList.add('hidden');
    });

    document.querySelectorAll('.prompt-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const text = chip.querySelector('.font-medium').textContent;
        sendMessage(text);
      });
    });

    // ============== Initialize ==============
    async function init() {
      await loadProjects();

      if (state.currentThreadId) {
        await selectSession(state.currentThreadId);
      } else {
        startNewChat();
      }
    }

    init();
  </script>
</body>
</html>
